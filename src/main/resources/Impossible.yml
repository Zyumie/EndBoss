# =====================================================================
#  EndBoss - Impossible.yml  (profil de difficulté "IMPOSSIBLE")
#  Invocation : /endboss spawn impossible
#  Les clés absentes reprennent leur valeur de Boss.yml.
#
#  Pensé pour un groupe entier, bien équipé et coordonné :
#   - 5000 PV, 65% de dégâts en moins, bouclier quasi hermétique
#   - 3 totems d'immortalité : à chaque coup mortel, le boss revient en phase 2
#   - régénération agressive dès qu'on relâche la pression
#   - capacités lourdes dès la phase 1, cooldowns très courts, skill quasi parfait
#  Il reste tuable : il faut enchaîner les dégâts, casser sa garde à la hache
#  et survivre à 3 résurrections.
# =====================================================================
boss:
  name: "&4&l§k||&r &c&l☠ EndBoss IMPOSSIBLE : Le Gardien du Vide &4&l§k||"
  health: 5000.0
  speed: 0.40
  damage: 18.0
  damage-taken-multiplier: 0.35
  ability-damage: 1.6
  single-instance: true

  regeneration:
    enabled: true

  equipment:
    helmet: "DRAGON_HEAD"
    chestplate: "NETHERITE_CHESTPLATE"
    leggings: "NETHERITE_LEGGINGS"
    boots: "NETHERITE_BOOTS"
    weapon: "MACE"
    offhand: "SHIELD"

  drops:
    lingots:
      material: NETHERITE_INGOT
      amount: 16
    blocs:
      material: DIAMOND_BLOCK
      amount: 8
    pommes:
      material: ENCHANTED_GOLDEN_APPLE
      amount: 5

  display:
    overhead-format: "&4☠ &c❤ &f{hearts} &6✦ {totems}"

  shield:
    damage-through: 0.05       # la garde bloque 95% des coups de face : il faut la briser à la hache

  totems:
    enabled: true
    count: 3                   # 3 vies
    revive-to-phase: 2         # retour en phase 2 à chaque totem
    message: "&6&l✦ TOTEM D'IMMORTALITÉ &e({left} restant(s))"
    display: true
    display-format: " &6✦ Totems : {left}/3"

  ai:
    tick-interval: 1           # il réfléchit 20x par seconde
    sight-range: 64.0
    bar-range: 80.0
    skill: 0.95
    adaptive-learning: true
    dodge-projectiles: true
    rest-regen-delay: 12.0     # 12 s sans le toucher et il se soigne
    rest-regen-percent: 5.0    # 5% de sa vie max par seconde
    minion-limit: 8

  griefing:
    break-blocks: true
    place-blocks: true
    restore-seconds: 20

  phases:
    phase-1:
      name-suffix: " &7[Phase 1 - Éveil]"
      health-threshold: 1.0
      scale: 1.2
      speed-multiplier: 1.1
      damage-multiplier: 1.3
      cooldown-multiplier: 0.7
      regen-per-second: 2.0
      abilities: [LEAP, DASH_STRIKE, SWORD_THROW, SHIELD_UP, BLINK, MACE_SMASH, SHOCKWAVE, BLOCK_BARRAGE]
    phase-2:
      name-suffix: " &e[Phase 2 - Courroux]"
      health-threshold: 0.66
      scale: 1.5
      speed-multiplier: 1.25
      damage-multiplier: 1.7
      cooldown-multiplier: 0.55
      regen-per-second: 5.0
      abilities: [LEAP, DASH_STRIKE, SWORD_THROW, SHIELD_UP, BLINK, MACE_SMASH, SHOCKWAVE, SUMMON, METEORS, BLOCK_BARRAGE, SKY_SLAM, ITEM_THEFT, SKY_RAPTURE, INVENTORY_SCRAMBLE]
    phase-3:
      name-suffix: " &4[Phase 3 - Calamité Finale]"
      health-threshold: 0.33
      scale: 1.9
      speed-multiplier: 1.4
      damage-multiplier: 2.2
      cooldown-multiplier: 0.4
      regen-per-second: 8.0
      abilities: [LEAP, DASH_STRIKE, SWORD_THROW, SHIELD_UP, BLINK, MACE_SMASH, SHOCKWAVE, SUMMON, METEORS, BLOCK_BARRAGE, SKY_SLAM, ITEM_THEFT, SKY_RAPTURE, INVENTORY_SCRAMBLE]
